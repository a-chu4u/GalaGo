
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}GalaGo{% endblock %}
    </title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

<header class="header">
    <div class="container header-inner">
        <a href="{% url 'home' %}" class="logo">
            Gala<span>Go.</span>
        </a>

        <nav class="desktop-nav">
            <a href="{% url 'home' %}">Explore</a>
            <a href="{% url 'home' %}#destinations">
                Destinations
            </a>
            <a href="{% url 'home' %}#about">
                About
            </a>
        </nav>

        <a href="{% url 'home' %}#destinations"
           class="nav-button">
            Explore Palawan ↗
        </a>
    </div>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="footer" id="about">
    <div class="container footer-inner">
        <div>
            <h2>GalaGo.</h2>
            <p>
                Discover beautiful places and
                unforgettable experiences in Palawan.
            </p>
        </div>

        <p class="footer-note">
            Made for Palawan explorers.
        </p>
    </div>
</footer>

<nav class="mobile-nav">
    <a href="{% url 'home' %}">
        <span>⌂</span>
        <small>Home</small>
    </a>

    <a href="{% url 'home' %}#destinations">
        <span>⌕</span>
        <small>Explore</small>
    </a>

    <a href="{% url 'home' %}#about">
        <span>♡</span>
        <small>About</small>
    </a>
</nav>

</body>
</html>
